<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Decorative Inner Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Monogram Logo 'إر' (Ertiqa) -->
  <g filter="url(#goldGlow)">
    <!-- Main Arabic Calligraphy Text 'إر' -->
    <text 
      x="50%" 
      y="58%" 
      font-family="'Cairo', 'Tajawal', 'Arial', sans-serif" 
      font-size="240" 
      font-weight="900" 
      fill="url(#goldGrad)" 
      text-anchor="middle" 
      dominant-baseline="central"
    >
      إر
    </text>

    <!-- Executive Star / Diamond Accent above -->
    <path 
      d="M256 70 L268 96 L294 108 L268 120 L256 146 L244 120 L218 108 L244 96 Z" 
      fill="url(#goldGrad)" 
    />
  </g>
</svg>
